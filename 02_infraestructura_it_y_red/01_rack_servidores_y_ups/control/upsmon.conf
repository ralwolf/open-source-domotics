# ==============================================================================
# CONFIGURACIÓN NUT (Network UPS Tools) - CLIENTE UPSMON
# Proyecto: open-source-domotics (Sala Técnica IT)
# ==============================================================================

# Conexión al servidor NUT en el UPS Online de Doble Conversión (1500/2000VA)
MONITOR ups_online@192.168.10.15:3493 1 monuser "!secret nut_password" master

# Umbrales de parada segura
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
NOTIFYCMD /usr/sbin/upssched
POLLFREQ 5
POLLFREQALERT 2
HOSTSYNC 15
DEADTIME 15
POWERDOWNFLAG /etc/killpower

# Notificaciones y acciones automáticas
NOTIFYFLAG ONLINE    SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT    SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG FSD       SYSLOG+WALL+EXEC
NOTIFYFLAG COMMOK    SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD   SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN  SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG NOCOMM    SYSLOG+WALL+EXEC

# Secuencia de apagado escalonado en cortes prolongados:
# 1. Al pasar a batería (ONBATT): Home Assistant envía alerta Push a celulares y desconecta cargas no críticas.
# 2. Si el corte dura > 15 minutos: Apagado limpio de VMs no críticas (Nextcloud, Media Server, Plex).
# 3. Al llegar al 20% de batería restante (LOWBATT): 
#    a. Sincronización de caché ZFS en TrueNAS y desmontaje seguro de pools.
#    b. Guardado de estados en Home Assistant y parada limpia de Proxmox VE.
#    c. Disparo de apagado del UPS para conservar batería para el rearranque.
