[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    4-20ma/ModbusMaster @ ^2.0.1
    knolleary/PubSubClient @ ^2.8
    olikraus/U8g2 @ ^2.35.9
    mandulaj/PZEM-004T-v30 @ ^1.1.2

build_flags =
    -D CORE_DEBUG_LEVEL=3
