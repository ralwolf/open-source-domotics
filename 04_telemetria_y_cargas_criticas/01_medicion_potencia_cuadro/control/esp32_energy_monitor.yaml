substitutions:
  device_name: "gateway-telemetria-energia"
  friendly_name: "Gateway Telemetría Cuadro General"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: arduino

# Conectividad de Red y Servidor Local
wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  fast_connect: true
  manual_ip:
    static_ip: 192.168.10.45
    gateway: 192.168.10.1
    subnet: 255.255.255.0
    dns1: 192.168.10.1

  ap:
    ssid: "Gateway-Energia-Fallback"
    password: "OpenSourceDomotics"

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome
    password: "!secret ota_password"

# Bus I2C para Pantalla OLED de Diagnóstico en Cuadro
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_i2c

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: bus_i2c
    pages:
      - id: page1
        lambda: |-
          it.printf(0, 0, id(font_title), "OPEN-SOURCE DOMOTICS");
          it.printf(0, 16, id(font_main), "Red: %.1f V  %.2f A", id(sensor_voltaje_red).state, id(sensor_corriente_red).state);
          it.printf(0, 32, id(font_main), "Potencia: %.0f W", id(sensor_potencia_total).state);
          it.printf(0, 48, id(font_small), "Freq: %.1fHz  IP: %s", id(sensor_frecuencia_red).state, wifi_wlan_ip_address.c_str());

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 10
  - file: "gfonts://Roboto"
    id: font_main
    size: 12
  - file: "gfonts://Roboto"
    id: font_small
    size: 9

# Configuración UART para Bus RS-485 Modbus RTU
uart:
  - id: uart_modbus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    stop_bits: 1

  # UART dedicada para sensores PZEM-004T v3
  - id: uart_pzem
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 9600
    stop_bits: 1

# Controlador Modbus Industrial para Analizador de Red Eastron SDM630
modbus:
  id: modbus_sdm630
  uart_id: uart_modbus
  flow_control_pin: GPIO23

modbus_controller:
  - id: sdm630
    address: 1
    modbus_id: modbus_sdm630
    setup_priority: -10

sensor:
  # 1. Medición de Acometida Principal (SDM630)
  - platform: modbus_controller
    modbus_controller_id: sdm630
    id: sensor_voltaje_red
    name: "Tensión de Red L-N"
    address: 0x0000
    register_type: input
    value_type: FP32
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sdm630
    id: sensor_corriente_red
    name: "Corriente Acometida Principal"
    address: 0x0006
    register_type: input
    value_type: FP32
    unit_of_measurement: "A"
    accuracy_decimals: 2
    device_class: current
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sdm630
    id: sensor_potencia_total
    name: "Potencia Activa Total Importada"
    address: 0x0034
    register_type: input
    value_type: FP32
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sdm630
    id: sensor_frecuencia_red
    name: "Frecuencia de Red"
    address: 0x0046
    register_type: input
    value_type: FP32
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
    device_class: frequency
    state_class: measurement

  - platform: modbus_controller
    modbus_controller_id: sdm630
    id: sensor_energia_total
    name: "Energía Acumulada Red Total"
    address: 0x0156
    register_type: input
    value_type: FP32
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  # 2. Sub-medición Derivados vía Módulo PZEM-004T v3
  - platform: pzemac
    uart_id: uart_pzem
    voltage:
      name: "PZEM Cocina Voltaje"
    current:
      name: "PZEM Cocina Corriente"
    power:
      id: sensor_potencia_cocina
      name: "PZEM Cocina Potencia"
    energy:
      name: "PZEM Cocina Energía Total"
    frequency:
      name: "PZEM Cocina Frecuencia"
    power_factor:
      name: "PZEM Cocina Factor de Potencia"
    update_interval: 2s

# Salidas de Relés para Automatización y Load-Shedding
switch:
  - platform: gpio
    pin: GPIO25
    id: rele_desconexion_cargas_secundarias
    name: "Corte Automático Cargas Secundarias (Load Shedding)"
    icon: "mdi:power-plug-off"
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin: GPIO26
    id: rele_seguridad_cuadro
    name: "Disparo de Seguridad de Emergencia"
    icon: "mdi:shield-alert"
    restore_mode: ALWAYS_OFF

# Reglas de Protección Local (Autónomas, sin depender de red/servidor)
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(sensor_potencia_total).state > 12000.0;' # Umbral 12 kW
          then:
            - switch.turn_off: rele_desconexion_cargas_secundarias
            - logger.log: "ALERTA: Sobrecarga en cuadro (>12kW). Desconectando cargas no críticas."
