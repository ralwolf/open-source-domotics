<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 750" width="100%" height="100%">
  <rect width="650" height="750" fill="#0f172a"/>

  <!-- Placa frontal de aluminio mecanizado anodizado oscuro (90 x 180 mm escalado) -->
  <rect x="200" y="90" width="250" height="520" rx="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Cono de visión de la cámara 160° FOV -->
  <polygon points="325,180 50,20 600,20" fill="#38bdf8" fill-opacity="0.15" stroke="#0284c7" stroke-dasharray="4" stroke-width="1.5"/>
  <text x="325" y="45" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ÁNGULO DE VISIÓN GRAN ANGULAR 160° FOV (CERO PUNTOS CIEGOS)</text>

  <!-- Lente de cámara gran angular DVP con anillo de LEDs infrarrojos invisibles 940 nm -->
  <circle cx="325" cy="180" r="32" fill="#030712" stroke="#64748b" stroke-width="3"/>
  <circle cx="325" cy="180" r="16" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
  <!-- 6 LEDs IR 940 nm invisibles -->
  <circle cx="325" cy="155" r="4" fill="#6d28d9"/>
  <circle cx="325" cy="205" r="4" fill="#6d28d9"/>
  <circle cx="303" cy="168" r="4" fill="#6d28d9"/>
  <circle cx="347" cy="168" r="4" fill="#6d28d9"/>
  <circle cx="303" cy="192" r="4" fill="#6d28d9"/>
  <circle cx="347" cy="192" r="4" fill="#6d28d9"/>
  <text x="325" y="235" fill="#a78bfa" font-family="sans-serif" font-size="10" text-anchor="middle">LEDs IR 940nm Invisibles</text>

  <!-- Rejilla de altavoz con baffle acústico impermeable (MAX98357A I2S Class D) -->
  <g id="altavoz" transform="translate(265, 275)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="12" x2="110" y2="12" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="24" x2="120" y2="24" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="36" x2="110" y2="36" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="48" x2="120" y2="48" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="325" y="345" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Altavoz Estanco IP65 3W</text>

  <!-- Orificio para micrófono digital I2S con membrana hidrofóbica (INMP441) -->
  <circle cx="325" cy="380" r="4" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="325" y="405" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Micrófono MEMS I2S (Cancelación de Eco)</text>

  <!-- Pulsador de llamada antivandálico con retroiluminación LED perimetral -->
  <circle cx="325" cy="490" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="325" cy="490" r="28" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Icono campana -->
  <path d="M 320,480 A 6,6 0 0,1 330,480 L 333,495 L 317,495 Z" fill="#f8fafc"/>
  <circle cx="325" cy="498" r="2" fill="#f8fafc"/>
  <text x="325" y="555" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TIMBRE PRINCIPAL</text>

  <!-- Tornillería Torx de seguridad con perno antirrobo -->
  <circle cx="215" cy="105" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="435" cy="105" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="215" cy="595" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="435" cy="595" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Titulo y dimensiones -->
  <text x="325" y="650" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PLANO DE FACHADA: VIDEOPORTERO WEBRTC ESP32-S3</text>
  <text x="325" y="675" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Dimensiones: 90 x 180 x 35 mm | Montaje Empotrado / Superficie con Visera Antilluvia</text>
</svg>
